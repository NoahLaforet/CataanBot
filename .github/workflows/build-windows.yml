name: build-windows

# Builds the self-contained Windows bridge .exe on a Windows runner and
# attaches CatanBot-windows.zip to the release the extension's "Download for
# Windows" button points at. PyInstaller cannot cross-compile, so this runs
# on windows-latest instead of being built by hand.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to attach CatanBot-windows.zip to
        default: v0.45.1
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bridge,wintray]" pyinstaller

      - name: Build the tray exe
        run: >
          python -m PyInstaller --noconfirm --clean
          --name catanbot-bridge --onefile --windowed
          --icon bin/catanbot.ico --paths src
          --collect-submodules catanbot --collect-submodules catanatron
          --collect-all uvicorn --collect-all pystray
          --add-data "extension/icons/icon-128.png;catanbot_assets"
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.loops.asyncio
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.protocols.websockets.websockets_impl
          --hidden-import uvicorn.protocols.websockets.wsproto_impl
          --hidden-import uvicorn.lifespan.on
          bin/win_tray_entry.py

      - name: Name it CatanBot.exe
        run: Copy-Item dist/catanbot-bridge.exe dist/CatanBot.exe

      - name: Smoke test (the exe must serve /advisor on 8765)
        run: |
          $p = Start-Process -FilePath dist/CatanBot.exe -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:8765/advisor -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          try { Stop-Process -Id $p.Id -Force } catch { }
          if (-not $ok) { Write-Error "bridge exe did not serve /advisor on :8765"; exit 1 }
          Write-Host "smoke test OK"

      - name: Zip
        run: Compress-Archive -Path dist/CatanBot.exe -DestinationPath dist/CatanBot-windows.zip -Force

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if (-not $tag) { $tag = "${{ github.event.release.tag_name }}" }
          if (-not $tag) { $tag = "v0.45.1" }
          Write-Host "uploading to release $tag"
          gh release upload $tag dist/CatanBot-windows.zip --clobber -R ${{ github.repository }}
