[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catanbot"
version = "0.47.0"
description = "Live Settlers of Catan advisor for colonist.io. Local FastAPI bridge plus a Chrome side-panel HUD with handcrafted heuristics over catanatron."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Noah Laforet" }]
keywords = ["catan", "colonist", "advisor", "userscript", "catanatron"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "catanatron>=3.2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
bridge = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
tray = [
    # macOS menu-bar launcher (bin/catanbot-tray). rumps is a Cocoa
    # wrapper, so it only installs on macOS; elsewhere the extra
    # resolves to nothing and bin/catanbot stays the launch path.
    "rumps>=0.4; sys_platform == 'darwin'",
]
wintray = [
    # Windows system-tray app (bin/win_tray_entry.py + catanbot.tray.win_app).
    # pystray draws the notification-area icon; Pillow (a base dep) loads it.
    "pystray>=0.19; sys_platform == 'win32'",
]

[project.scripts]
catanbot = "catanbot.cli:main"
catanbot-tray = "catanbot.tray.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the menu-bar status icons (generated by bin/gen_tray_icons.py) so
# a non-editable install still finds them via app.py's _icon(); without
# this a built wheel would render a blank menu-bar item.
"catanbot.tray" = ["assets/*.png"]
