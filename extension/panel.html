<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CatanBot</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="panel" id="panel">
  <div class="header" id="header">
    <span class="dot" id="dot"></span>
    <span class="title">CatanBot</span>
    <span class="variant-badge" id="variant-badge"></span>
    <button class="scan-map-btn" id="scan-map-btn" title="This board's layout isn't in the bot's classic-rules allow-list yet. Click to confirm it uses standard tiles and rules so recs turn back on.">map not recognized: scan</button>
    <span class="friendly-robber-badge" id="friendly-robber-badge" title="Friendly Robber rule is on · players at or below 2 VP are protected; targets ranking has filtered them out.">friendly robber</span>
    <span class="paused-badge" id="paused-badge">paused</span>
    <button class="btn settings-btn" id="settings" title="settings (alt+s)">⚙</button>
    <button class="btn" id="popout" title="pop out into a separate window (alt+o)">⇱</button>
    <button class="btn" id="toggle" title="collapse/expand (alt+c)">_</button>
  </div>
  <div class="drawer" id="drawer">
    <div class="drawer-row">
      <span class="drawer-label">actions</span>
      <button class="drawer-btn danger" id="new-game">new game</button>
      <button class="drawer-btn" id="copy-snap">copy snapshot</button>
      <button class="drawer-btn" id="replay-frames" title="Re-broadcast the cached GameStart frame so the standalone path can rebuild from the current colonist game. Useful when extension mode says &quot;waiting for game start&quot; mid-game.">force replay</button>
    </div>
    <div class="drawer-row">
      <span class="drawer-label">advisor</span>
      <label class="toggle"><input type="checkbox" id="pause"/><span>pause banners &amp; recs</span></label>
    </div>
    <!-- Advisor-source selector. Hidden by default (dev-only): normal
         users are always in BRIDGE mode and never see auto / extension.
         panel.js removes the `hidden` attribute only when
         localStorage.catanbot_dev === '1'. -->
    <div class="drawer-row" id="advisor-mode-row" hidden>
      <span class="drawer-label">source</span>
      <label class="seg-radio">
        <input type="radio" name="advisor-mode" id="mode-auto" value="auto" checked/>
        <span>auto</span>
      </label>
      <label class="seg-radio">
        <input type="radio" name="advisor-mode" id="mode-bridge" value="bridge"/>
        <span>bridge only</span>
      </label>
      <label class="seg-radio">
        <input type="radio" name="advisor-mode" id="mode-extension" value="extension"/>
        <span>extension only</span>
      </label>
      <span class="seg-radio-status" id="advisor-mode-status"></span>
    </div>
    <div class="drawer-row">
      <span class="drawer-label">privacy</span>
      <label class="toggle"><input type="checkbox" id="streamer-mode"/><span>streamer mode (hide usernames)</span></label>
    </div>
    <div class="drawer-row">
      <span class="drawer-label">opacity</span>
      <input type="range" id="opacity" min="40" max="100" step="5" value="100"/>
      <span class="opacity-val" id="opacity-val">100%</span>
    </div>
    <div class="drawer-row">
      <span class="drawer-label">game</span>
      <label class="drawer-num"><span class="drawer-num-l">VP</span>
        <input type="number" id="vp-target" min="3" max="20" step="1"/>
      </label>
      <label class="drawer-num"><span class="drawer-num-l">discard</span>
        <input type="number" id="discard-limit" min="3" max="20" step="1"/>
      </label>
      <span class="drawer-num-status" id="game-cfg-status"></span>
    </div>
    <div class="drawer-row drawer-help">
      <span class="drawer-label">keys</span>
      <span class="drawer-hint">alt+p pause &middot; alt+c collapse &middot; alt+n new game &middot; alt+s settings &middot; alt+o pop out</span>
    </div>
  </div>
  <div class="body" id="body">
    <div id="content"><span class="muted">waiting for bridge&hellip;</span></div>
    <!-- Live roll histogram. Lives outside #content so its DOM
         persists across innerHTML rewrites — that's the only way to
         get the bar height transitions to fire on actual roll events
         instead of replaying every poll tick. -->
    <div id="hist-host" class="hist-host hidden">
      <div class="hist-h">rolls <span class="hist-total" id="hist-total">0</span></div>
      <div class="hist" id="hist"></div>
    </div>
    <!-- Eval sparkline (HUD principle #6). Shows the bridge's per-roll
         eval-state series; the line goes green when ahead, red when
         behind. Persistent SVG so the path animates only on real
         changes. Hidden until the bridge's eval_history has 2+ samples
         (one point isn't a line). -->
    <div id="eval-host" class="eval-host hidden">
      <div class="eval-h">eval <span class="eval-cur" id="eval-cur">0</span></div>
      <svg id="eval-graph" class="eval-graph" viewBox="0 0 200 56"
           preserveAspectRatio="none">
        <path id="eval-fill" class="eval-fill-pos" d=""></path>
        <line id="eval-zero" class="eval-zero" x1="0" y1="28" x2="200" y2="28"></line>
        <path id="eval-line" class="eval-line" d=""></path>
        <circle id="eval-dot" class="eval-dot" cx="0" cy="28" r="2.5"></circle>
      </svg>
    </div>
    <!-- Move-quality strip (HUD principle #7). Per-build chess-style
         classification of self plays vs. the bot's top-10 recs at
         decision time. Hidden until at least one post-setup self build
         has been graded — empty bridge state otherwise. -->
    <div id="mq-host" class="mq-host hidden">
      <div class="mq-h">moves</div>
      <div class="mq-tally" id="mq-tally"></div>
      <div class="mq-last" id="mq-last"></div>
    </div>
    <!-- Dev-deck remaining-by-type strip (Noah's 2026-05-02 ask). Last
         row in the body so it doesn't compete with active recs. Counts
         derived from PLAYED_{type} across all seats — VP cards omitted
         because plays aren't logged for them. -->
    <div id="dev-deck-host" class="dev-deck-host hidden">
      <div class="dev-deck-h">dev deck</div>
      <div class="dev-deck" id="dev-deck"></div>
    </div>
    <!-- Who-robbed-whom steal matrix. Persistent host like the strips
         above so its DOM survives #content rewrites. Hidden until the
         bridge ships a non-empty snap.steal_matrix (first steal lands). -->
    <div id="steals-host" class="steals-host hidden">
      <div class="steals-h">steals</div>
      <div class="steals" id="steals"></div>
    </div>
  </div>
  <div class="resize-handle" id="resize-handle" title="drag to resize"></div>
</div>
<!-- Type=module so panel.js can dynamic-import lib/index.js for
     the standalone JS recommender path. The non-module path
     used to work but blocked import() of the lib bundle when
     the bridge is unreachable. -->
<script type="module" src="panel.js"></script>
</body>
</html>
